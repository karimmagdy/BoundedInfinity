[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bounded-infinity"
version = "0.3.0"
description = "Bounding Unbounded Agentic Swarms: a mathematically rigorous memory management architecture for multi-agent systems"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "BoundedInfinity Research" }]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]
bench = [
    "psutil>=5.9",
    "matplotlib>=3.8",
]
llm = [
    "google-generativeai>=0.5",
    "openai>=1.0",
    "anthropic>=0.20",
    "scikit-learn>=1.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
